<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Token scanner — Blockfisher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,520;1,9..144,520&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        if (q.get("embed") !== "1") return;
        document.documentElement.classList.add("is-embed");
        var theme = q.get("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        window.addEventListener("message", function (event) {
          var data = event.data || {};
          if (data.type !== "blockfisher-theme") return;
          if (data.theme === "light" || data.theme === "dark") document.documentElement.dataset.theme = data.theme;
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
